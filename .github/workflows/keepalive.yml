name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sparta-west
        shell: bash
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null --max-time 60 -w '%{http_code}' https://sparta-west.onrender.com/ || true)
            echo "attempt $i: HTTP ${code:-000}"
            case "$code" in
              [1-4][0-9][0-9]) exit 0 ;;
            esac
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          exit 1
