name: Age update pipeline checks

on:
  push:
    branches: [main]
    paths:
      - "bot/parsers/**"
      - "bot/services/ageRuleMerge.js"
      - "bot/services/ageUpdateService.js"
      - "bot/services/buildAgeRecalculator.js"
      - "bot/handlers/buttonHandler.js"
      - "bot/services/ageUpdateMessageHandler.js"
      - "bot/tests/**"
      - "bot/package.json"
      - "package.json"
      - "requirements.txt"
      - "scripts/ensure-python-parser.js"
      - ".github/workflows/age-update-pipeline.yml"
  pull_request:
    paths:
      - "bot/parsers/**"
      - "bot/services/ageRuleMerge.js"
      - "bot/services/ageUpdateService.js"
      - "bot/services/ageUpdateMessageHandler.js"
      - "bot/tests/**"
      - "bot/package.json"
      - ".github/workflows/age-update-pipeline.yml"
  workflow_dispatch:

jobs:
  age-update-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: Install PDF table extraction dependency
        run: node ../scripts/ensure-python-parser.js
      - run: |
          node --check parsers/pdfTableText.js
          ../.venv/bin/python -m py_compile parsers/pdf_table_extract.py
          node --check ../scripts/ensure-python-parser.js
          node --check parsers/ageChangeParser.js
          node --check services/ageRuleMerge.js
          node --check services/ageUpdateService.js
          node --check services/buildAgeRecalculator.js
          node --check services/ageUpdateMessageHandler.js
          node --check services/ageChangeReport.js
          node --check handlers/buttonHandler.js
      - run: node --test tests/age-update-pipeline.test.js
