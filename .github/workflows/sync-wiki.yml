name: Sync Utopia Wiki

on:
  push:
    branches: [main]
    paths:
      - "app/command/wiki/page.tsx"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Spartan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy authoritative Utopia wiki
        run: |
          mkdir -p public
          curl -fsSL https://raw.githubusercontent.com/shadowjuice69/utopia-nexus/main/utopia-wiki.html -o public/utopia-wiki.html

      - name: Commit wiki copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/utopia-wiki.html
          if git diff --cached --quiet; then
            echo "Wiki is already synchronized."
          else
            git commit -m "Sync authoritative Utopia wiki into Spartan"
            git push
          fi
