name: Build Spartan Capture 4.0.4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[spartan-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Chrome client from the same 4.0.4 engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scraper-current/chrome-4.0.4
          python3 - <<'PY'
          import json, pathlib
          src = pathlib.Path('scraper-current/spartan-universal-capture-4.0.4.user.txt').read_text()
          body = src.split('// ==UserScript==', 1)[1].split('// ==/UserScript==', 1)[1]
          shim = r'''/* Spartan Universal Capture 4.0.4 — Chrome adapter generated from the same engine. */
          function GM_getValue(key, fallback) {
            try { const raw = localStorage.getItem('spartan_gm_' + key); if (raw === null) return fallback; try { return JSON.parse(raw); } catch (_) { return raw; } } catch (_) { return fallback; }
          }
          function GM_setValue(key, value) { try { localStorage.setItem('spartan_gm_' + key, JSON.stringify(value)); } catch (_) {} }
          function GM_setClipboard(value) { try { navigator.clipboard?.writeText(String(value ?? '')); } catch (_) {} }
          function GM_xmlhttpRequest(opts) {
            try {
              chrome.runtime.sendMessage({ __spartanFetch: true, method: opts.method || 'POST', url: opts.url, headers: opts.headers || {}, data: opts.data, timeout: opts.timeout || 28000 }, response => {
                if (chrome.runtime.lastError) return opts.onerror?.(new Error(chrome.runtime.lastError.message));
                if (!response) return opts.onerror?.(new Error('No background response'));
                if (response.timedOut) return opts.ontimeout?.();
                if (response.error) return opts.onerror?.(new Error(response.error));
                opts.onload?.({ status: response.status, responseText: response.responseText });
              });
            } catch (error) { opts.onerror?.(error); }
          }
          '''
          pathlib.Path('scraper-current/chrome-4.0.4/content.js').write_text(shim + body)
          manifest = {
            'manifest_version': 3,
            'name': 'Spartan Universal Capture',
            'version': '4.0.4',
            'description': 'Reliable Utopia page capture for Spartan.',
            'permissions': ['clipboardWrite'],
            'host_permissions': [
              'https://www.utopia-game.com/*', 'https://utopia-game.com/*',
              'https://intel.utopia-game.com/*', 'https://intel.utopia.site/*',
              'https://spartan-dashboard.onrender.com/*'
            ],
            'background': {'service_worker': 'background.js'},
            'content_scripts': [{
              'matches': [
                'https://www.utopia-game.com/*', 'https://utopia-game.com/*',
                'https://intel.utopia-game.com/*', 'https://intel.utopia.site/*'
              ],
              'js': ['content.js'], 'run_at': 'document_end', 'all_frames': False
            }]
          }
          pathlib.Path('scraper-current/chrome-4.0.4/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          readme = '''# Spartan Universal Capture 4.0.4\n\nChrome client generated from the same capture engine as the Tampermonkey 4.0.4 client.\n\nThe client identifies the page from its URL/content, identifies the owner through the Spartan capture identity service, retries failed captures silently, and reports CAPTURED only after the server confirms the record exists in the capture vault.\n'''
          pathlib.Path('scraper-current/chrome-4.0.4/README.md').write_text(readme)
          PY

      - name: Package Chrome client
        run: |
          cd scraper-current
          rm -f spartan-universal-capture-chrome-4.0.4.zip
          zip -qr spartan-universal-capture-chrome-4.0.4.zip chrome-4.0.4

      - name: Commit generated Chrome client
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scraper-current/chrome-4.0.4 scraper-current/spartan-universal-capture-chrome-4.0.4.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[spartan-build] Build aligned Chrome 4.0.4 client'
          git push
